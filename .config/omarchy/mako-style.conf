# Personal mako layout. Colors are NOT here -- they come from whatever
# omarchy theme is active, so this survives theme switches and updates.
# Applied by ~/.local/bin/mako-restyle via the theme-set/post-update hooks.
width=400
height=120
padding=14
border-size=2
border-radius=8
margin=8
outer-margin=20
font=Adwaita Sans 11
anchor=top-right
default-timeout=2000
# Apps (Chromium webapps like WhatsApp) send their own expire_timeout, which
# beats default-timeout unless this is set. Forces 2s for everything.
ignore-timeout=1
max-visible=4
max-icon-size=32
icon-border-radius=4
text-alignment=left
format=<span font_family="JetBrainsMono Nerd Font"><b>%s</b></span>\n%b

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
