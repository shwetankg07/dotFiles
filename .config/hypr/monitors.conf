# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Setup for Predator laptop with external Acer monitor
# External monitor (HDMI-A-1) is on the left
monitor=HDMI-A-1,1920x1080@100,-1920x0,1
# Laptop monitor (eDP-2) is on the right
monitor=eDP-2,2560x1600@240,0x0,1.6
