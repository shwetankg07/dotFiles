# Change the default Omarchy look'n'feel
#
# https://wiki.hyprland.org/Configuring/Variables/#general

#changing cursor
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24


general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 10
    blur{
        enabled = true
        size = 3
        passes = 1
      }
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

animations {
    enabled = true

    # The "Bounce" Curve (The secret sauce)
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # Animation Speed & Style
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default

    # Layer surfaces (mako, waybar, walker, swayosd).
    # The layerrule in hyprland.conf picks the STYLE per layer; speed and
    # curve can only be set here, globally. notifBounce overshoots slightly
    # (y2 > 1) so notifications settle with a small bounce instead of easing
    # flatly into place. Style stays `fade` so waybar/walker are unaffected.
    bezier = notifBounce, 0.16, 1.28, 0.32, 1
    animation = layersIn, 1, 4.5, notifBounce, fade
    animation = layersOut, 1, 2.5, easeOutQuint, fade
}
