# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Brightness: 5% steps, floored so the panel never blacks out.
# The unbinds are required, same as the volume keys below: without them
# Hyprland also fires the omarchy default and every press moves 10%.
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
bindeld = , XF86MonBrightnessUp, Brightness up, exec, ~/.local/bin/bright-step up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, ~/.local/bin/bright-step down
# Super n to get or remove the waybar
bind = SUPER, N, exec, pkill -SIGUSR1 waybar

# Precision Brightness (1% steps)
bindel = SUPER ALT, XF86MonBrightnessUp, exec, brightnessctl --device=intel_backlight set +1%
bindel = SUPER ALT, XF86MonBrightnessDown, exec, brightnessctl --device=intel_backlight set 1%- --min-value=20

# Override Volume steps (using SwayOSD).
# The unbinds are required: without them Hyprland fires the omarchy default
# (--output-volume raise/lower, 5%) *and* this bind on the same key press.
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
bindeld = , XF86AudioRaiseVolume, Volume up, exec, ~/.local/bin/vol-step up
bindeld = , XF86AudioLowerVolume, Volume down, exec, ~/.local/bin/vol-step down


# Make Super+Alt+W change the wallpaper
bind = SUPER ALT, W, exec, ~/.config/hypr/scripts/wallpaper_slideshow.sh

bind = $mainMod ALT, W, exec, ~/.config/hypr/scripts/wall-picker.sh

# browser with the sloppy key
bind = , XF86Launch7, exec, kitty -e btop

# mouse toggle workspace
bind = , mouse:275, workspace, e+1
 
# special workspace through forward click
bind = , mouse:276, togglespecialworkspace, scratchpad

# Toggle internal panel 240Hz <-> 60Hz
bindd = SUPER SHIFT, R, Refresh rate toggle, exec, ~/.config/hypr/scripts/refresh-toggle.sh

# Keyboard RGB preset picker
bindd = SUPER SHIFT, K, Keyboard RGB presets, exec, ~/.local/bin/kbrgb-menu
