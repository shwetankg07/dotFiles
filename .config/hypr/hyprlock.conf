# Theme colors: $color, $inner_color, $outer_color, $font_color,
# $placeholder_color, $check_color  (re-themes automatically)
source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1

    # Global surface fade on lock/unlock
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth

    # Full input-field animation set
    animation = inputFieldColors, 1, 3, smooth   # ring color transitions (typing/fail)
    animation = inputFieldFade, 1, 4, smooth     # field fades in on wake
    animation = inputFieldWidth, 1, 3, smooth    # pill grows on focus/fail
    animation = inputFieldDots, 1, 2, smooth     # password dots animate in
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
    blur_size = 6
    brightness = 0.75
    contrast = 0.95
    vibrancy = 0.15
}

# ── Clock ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $font_color
    font_family = JetBrainsMono Nerd Font ExtraBold
    font_size = 150
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Date ──────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B'
    color = $outer_color
    font_family = JetBrainsMono Nerd Font
    font_size = 22
    position = 0, 60
    halign = center
    valign = center
}

# ── Greeting ──────────────────────────────────────────
label {
    monitor =
    text = Welcome back
    color = $placeholder_color
    font_family = JetBrainsMono Nerd Font
    font_size = 15
    position = 0, 22
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────
input-field {
    monitor =
    size = 340, 56
    position = 0, -90
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 3
    rounding = 28

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color
    placeholder_text = <span>󰌾  Enter Password</span>
    check_color = $check_color
    fail_color = rgba(247, 110, 120, 1)
    fail_text = <i>󰀦  $FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(247, 110, 120, 1)

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    fade_on_empty = false
}

# ── Battery (bottom-left) ─────────────────────────────
label {
    monitor =
    text = cmd[update:30000] CAP="$(cat /sys/class/power_supply/BAT1/capacity)"; ST="$(cat /sys/class/power_supply/BAT1/status)"; [ "$ST" = "Charging" ] && I="󰂄" || I="󰁹"; echo "$I  $CAP%"
    color = $placeholder_color
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    position = 40, 30
    halign = left
    valign = bottom
}

# ── Now playing (bottom-right) ────────────────────────
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/hyprlock-nowplaying.sh
    color = $placeholder_color
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    position = -40, 30
    halign = right
    valign = bottom
}

auth {
    fingerprint:enabled = false
}
