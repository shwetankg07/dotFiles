# --- Omarchy Theme Integration ---
include ~/.config/omarchy/current/theme/kitty.conf

# --- Font (Ghostty Standard) ---
font_family      JetBrainsMono Nerd Font
font_size        14.0

# --- Famous Kitty Cursor Animations ---
# Enables the trailing "smear" effect
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# --- Cursor Shape & Behavior ---
# 'beam' is the vertical line you requested
cursor_shape                 beam
cursor_beam_thickness        1.5
# Set to 0 to stop blinking as requested
cursor_blink_interval        0

# --- Glass Mode Aesthetics ---
background_opacity           0.1
window_padding_width         14
window_padding_height        14
hide_window_decorations      yes
confirm_os_window_close      0
enable_audio_bell            no

# --- Interaction & Keybindings ---
wheel_scroll_multiplier      0.95
map ctrl+insert              copy_to_clipboard
map shift+insert             paste_from_clipboard

# --- Advanced Power User ---
single_instance              yes
allow_remote_control         yes
show_window_resize_notification no

# --- Tab Bar (Powerline Style) ---
tab_bar_edge                 bottom
tab_bar_style                powerline
tab_powerline_style          slanted
tab_title_template           {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
